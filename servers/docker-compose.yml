services:
  client:
    depends_on:
      server:
        condition: service_healthy
    image: curlimages/curl:latest
    command: >
      sh -c "(curl --cacert /opt/certs/ca.crt
      --cert /opt/certs/client.crt 
      --key /opt/certs/client.key
      https://server | 
      grep 'Welcome to TLS Testing' ) && 
      exit 0 || 
      exit 1"
    volumes:
      - ${CLIENT_CERT}:/opt/certs/client.crt:ro
      - ${CLIENT_KEY}:/opt/certs/client.key:ro
      - ${CLIENT_CA}:/opt/certs/ca.crt:ro