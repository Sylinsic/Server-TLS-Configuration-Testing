services:
  server:
    image: haproxy:latest
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${SERVER_CERT}:/opt/certs/server.crt:ro
      - ${SERVER_KEY}:/opt/certs/server.key:ro
      - ${SERVER_CA}:/opt/certs/ca.crt:ro
      - ${SERVER_ROOT}:/opt/certs/root.crt:ro
      - ${BASE_DIR}/servers/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 0.5s
      timeout: 0.2s
      retries: 3

  backend:
    image: nginx:latest
    volumes:
      - ${BASE_DIR}/servers/traefik/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BASE_DIR}/servers/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 0.5s
      timeout: 0.2s
      retries: 3