global
  user haproxy
  group haproxy
  daemon
  maxconn 4096

  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  mode http

  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout queue 30s

  default_backend backend

crt-store
  crt-base /opt/certs
  key-base /opt/certs
  load crt "server.crt" key "server.key" alias "server"

frontend http_front
  bind *:80

frontend https_front
  bind *:443 ssl crt "@/server" ca-file "/opt/certs/ca.crt" ca-verify-file "/opt/certs/root.crt" verify required

  http-request deny deny_status 403 unless { ssl_c_verify 0 }

backend backend
    balance roundrobin
    server backend backend:80
