# Listen on HTTP and HTTPS
Listen 80
Listen 443
ServerName server

# Load modules required for httpd to function in this configuration
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule dir_module modules/mod_dir.so

# Document root
DocumentRoot "/usr/local/apache2/htdocs/"
<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<VirtualHost *:80>
</VirtualHost>

# HTTPS Virtual Host
<VirtualHost *:443>
    SSLEngine on
    
    SSLCertificateFile "/opt/certs/server.crt"
    SSLCertificateKeyFile "/opt/certs/server.key"

    SSLVerifyClient require
    SSLVerifyDepth 2

    SSLCACertificateFile "/opt/certs/ca.crt"
</VirtualHost>