services:
  server:
    image: traefik:latest
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./${SERVER_CERT}:/opt/certs/server.crt:ro
      - ./${SERVER_KEY}:/opt/certs/server.key:ro
      - ./${SERVER_CA}:/opt/certs/ca.crt:ro
      - ./servers/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./servers/traefik/server.yml:/opt/traefik/server.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost"]
      interval: 0.5s
      timeout: 0.2s
      retries: 3

  backend:
    image: nginx:latest
    volumes:
      - ./servers/traefik/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./servers/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 0.5s
      timeout: 0.2s
      retries: 3