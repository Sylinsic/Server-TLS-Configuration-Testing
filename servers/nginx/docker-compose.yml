services:
  server:
    image: nginx:latest
    volumes:
      - ./${SERVER_CERT}:/opt/certs/server.crt:ro
      - ./${SERVER_KEY}:/opt/certs/server.key:ro
      - ./${SERVER_CA}:/opt/certs/ca.crt:ro
      - ./servers/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s